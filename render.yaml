services:
  - type: web
    name: Cyber Cash
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*' --timeout-keep-alive 75
    autoDeploy: true
    envVars:
      - key: ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATABASE_URL
        fromDatabase:
          name: cybercash-postgres-test
          property: connectionString
      - key: SYNC_DATABASE_URL
        fromDatabase:
          name: cybercash-postgres-test
          property: connectionString
      - key: OTP_PROVIDER
        value: email
      - key: MAIL_PROVIDER
        value: resend
      - key: MAIL_TIMEOUT_SECONDS
        value: "8"
